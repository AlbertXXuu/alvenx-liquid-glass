name: Verify design kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build independent entrance first frame
        run: node node_modules/vite/bin/vite.js build --base /entrance-first-frame/ --outDir output/ci/entrance-first-frame
      - name: Verify entrance prerender and responsive material frames
        run: node showcase/budding-refinement-review/prerender.mjs --out-dir output/ci/entrance-first-frame --base /entrance-first-frame/
      - run: npm run test:contract
      - run: npm run test:runtime
      - run: node scripts/verify-kit.mjs --baseline-only
